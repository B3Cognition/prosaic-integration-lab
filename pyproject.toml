[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic-integration-lab"
version = "0.8.0"
description = "Synthetic acceptance consumer for installed Prosaic releases"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "PyYAML", "jsonschema", "pyuca", "PyJWT[crypto]>=2.15,<3", "packaging"]

[project.optional-dependencies]
test = ["pytest", "build"]
token-counters = ["transformers==5.17.0", "tokenizers==0.23.2", "jinja2==3.1.6"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["prosaic_integration_lab*", "lab_runner*"]

[tool.setuptools.package-data]
"lab_runner.native_eval" = ["data/subagents/*.md"]
"lab_runner.quality" = ["data/*.json", "data/*.md"]
"lab_runner.memory" = ["data/*.json"]
"lab_runner.explore" = ["web/*", "web/assets/*", "web/font-licenses/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src", ".", "tests/unit", "tests/acceptance"]
testpaths = ["tests/unit", "tests/functional"]
