name: Experimental catalogue ontology

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-ontology:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        origin: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Qualify the copied blueprint in an isolated RC consumer
        env:
          BUILD_ORIGIN: ${{ matrix.origin }}
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/catalogue-ontology.XXXXXX")
          source="$GITHUB_WORKSPACE"
          python -m venv "$work/build-env"
          builder="$work/build-env/bin/python"
          "$builder" -m pip install --require-hashes -r "$source/dependencies/requirements.lock" -r "$source/dependencies/rule-admission-build.lock"
          if [[ "$BUILD_ORIGIN" == sdist ]]; then
            "$builder" -m build --no-isolation --sdist --outdir "$work/sdist" "$source"
            mkdir "$work/extracted"
            tar -xzf "$work/sdist/"*.tar.gz -C "$work/extracted"
            extracted=("$work/extracted/"*/)
            test "${#extracted[@]}" -eq 1
            source="${extracted[0]}"
          fi
          "$builder" -m build --no-isolation --wheel --outdir "$work/wheel" "$source"

          python -m venv "$work/consumer"
          consumer="$work/consumer/bin/python"
          "$consumer" -m pip install --require-hashes -r "$source/dependencies/requirements.lock"
          "$consumer" -m pip install --no-deps --require-hashes -r "$source/dependencies/catalogue-ontology-rc.lock"
          "$consumer" -m pip install --no-deps "$work/wheel/"*.whl
          "$consumer" -m pip check
          cd "$work"
          "$consumer" -I -m pytest -o pythonpath= -q "$source/tests/catalogue_ontology_acceptance" --junitxml="$work/tests.xml"
          "$consumer" - "$work/tests.xml" "$RUNNER_TEMP/catalogue-ontology-summary.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          from xml.etree import ElementTree

          suite, = ElementTree.parse(sys.argv[1]).getroot().iter("testsuite")
          counts = {name: int(suite.attrib[name]) for name in ("tests", "failures", "errors", "skipped")}
          if counts["tests"] <= 0 or any(counts[name] for name in ("failures", "errors", "skipped")):
              raise SystemExit(f"Invalid experimental acceptance result: {counts}")
          Path(sys.argv[2]).write_text(json.dumps({"origin": os.environ["BUILD_ORIGIN"], **counts}) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalogue-ontology-${{ matrix.origin }}
          path: ${{ runner.temp }}/catalogue-ontology-summary.json
          if-no-files-found: error
