name: Verify the documented public Linux image setup
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  documented-setup:
    name: Public pull and Bubblewrap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
            config: sha256:02d0612f3fab605752d8c2205fa435491f623d9b40d4386734149a301ab56016
            manifest: sha256:f4c871c934752f67bdacc8a79442b069093bba825e2e089fd34bd1779eaf2ad5
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
            config: sha256:6b0a5b3cd318658fbb1341a3b8235bc605e1bdc4cceee28cf57aa79e5554f12b
            manifest: sha256:2e74b16cde92101e2aa46b69d180cacc43f9dae2efd5aae41bba6f274443e141
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_MACHINE: ${{ matrix.machine }}
      QUALIFIED_CONFIG: ${{ matrix.config }}
      QUALIFIED_MANIFEST: ${{ matrix.manifest }}
      INDEX: sha256:b79a80ab94cb10c35be0b093890d29fbc6d69f6bc6d6a0d39d1936b53f87a222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ea9d3df738cd84607223e067209026affe675210
          path: lab-docs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f5e1b10034fdbaab11f9f7181a443412f42ce95
          path: image-source
          persist-credentials: false
      - name: Confirm fresh native host and extract the published commands
        id: prepare
        run: |
          test "$(uname -m)" = "$TARGET_MACHINE"
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = "linux/$TARGET_MACHINE"
          profiles=$(sudo cat /sys/kernel/security/apparmor/profiles)
          if grep -Eq '^prosaic-lab-cli-sandbox[[:space:]]' <<< "$profiles"; then
            echo 'The Lab witness AppArmor profile is still loaded'
            exit 1
          fi
          members=$(docker container ls --all --quiet --filter label=io.prosaic.lab.cli-sandbox-qualification)
          test -z "$members"
          config_dir=$(mktemp -d "$RUNNER_TEMP/anonymous-docker.XXXXXX")
          scratch=$(mktemp -d "$RUNNER_TEMP/witness-scratch.XXXXXX")
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$config_dir/config.json"
          printf 'DOCKER_CONFIG=%s\nWITNESS_SCRATCH=%s\n' "$config_dir" "$scratch" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          notes = Path('lab-docs/docs/releases.md').read_text().split('## Lab package release notes', 1)[0]
          pull, = re.findall(r'```sh\n(.*?)\n```', notes, re.S)
          policy, = re.findall(r'```bash\n(.*?)\n```', notes, re.S)
          ref = 'ghcr.io/b3cognition/prosaic-integration-lab@' + os.environ['INDEX']
          assert pull == f'docker pull {ref}'
          assert ref in policy and policy.count('arch=amd64') == 1
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'documented-pull.sh').write_text(pull + '\n')
          (temp / 'documented-policy.sh').write_text(
              policy.replace('arch=amd64', 'arch=' + os.environ['TARGET_ARCH']) + '\n'
          )
          PY
      - name: Pull the public index with no registry credentials
        run: |
          unset DOCKER_AUTH_CONFIG DOCKER_DEFAULT_PLATFORM
          ref="ghcr.io/b3cognition/prosaic-integration-lab@$INDEX"
          if docker image inspect "$ref" > /dev/null 2>&1; then
            echo 'The runner already has the published image'
            exit 1
          fi
          bash "$RUNNER_TEMP/documented-pull.sh" | tee "$RUNNER_TEMP/lab-pull.log"
          grep -Fx "Digest: $INDEX" "$RUNNER_TEMP/lab-pull.log"
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")
          test "$platform" = "linux/$TARGET_ARCH"
          image=$(docker image inspect --format '{{.Id}}' "$ref")
          [[ "$image" == "$QUALIFIED_CONFIG" || "$image" == "$QUALIFIED_MANIFEST" ]]
          printf 'Fresh anonymous pull matched %s on %s with local image ID %s\n' "$INDEX" "$platform" "$image"
      - name: Run the published Bubblewrap setup verbatim for this architecture
        working-directory: image-source
        run: TMPDIR="$WITNESS_SCRATCH" bash "$RUNNER_TEMP/documented-policy.sh"
      - name: Verify AppArmor, witness container, and seccomp-file cleanup
        if: always() && steps.prepare.outcome == 'success'
        run: |
          profiles=$(sudo cat /sys/kernel/security/apparmor/profiles)
          if grep -Eq '^prosaic-lab-cli-sandbox[[:space:]]' <<< "$profiles"; then
            echo 'The Lab witness AppArmor profile is still loaded'
            exit 1
          fi
          members=$(docker container ls --all --quiet --filter label=io.prosaic.lab.cli-sandbox-qualification)
          test -z "$members"
          rmdir "$WITNESS_SCRATCH"
          cmp -s "$DOCKER_CONFIG/config.json" <(printf '%s\n' '{"auths":{"ghcr.io":{}}}')
          echo 'Cleanup verified: AppArmor profile unloaded, no witness containers, temporary seccomp file removed, no registry credentials.'
