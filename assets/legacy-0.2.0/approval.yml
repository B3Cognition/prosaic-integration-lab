version: 1
runtime: runtime.yml
source: .
start: approval
limits: {max_calls: 1, max_tokens: 1, timeout_s: 10, max_run_s: 120}
steps:
  approval:
    kind: pause
    question: Approve this fixture request?
    choices: {approve: done, reject: rejected}
  done: {kind: finish}
  rejected: {kind: finish, outcome: rejected}
