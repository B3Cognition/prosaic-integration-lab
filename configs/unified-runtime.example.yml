# Released Runtime 0.9.8. Copy all three example configs together privately.
# Aliases and quota identities must be distinct unless they share a real quota.
kind: unified
native_config: native-runtime.example.yml
api_config: runtime-comparison-local.example.yml
api_quota_keys:
  local-strong: local-service
pools:
  agents:
    profiles: [claude-main, codex-main, local-strong]
    cooldown_s: 300
default_pool: agents
capacity_file: unified-capacity.json
