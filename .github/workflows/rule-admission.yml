name: Rule admission integration
# Candidate lane for prosaic-runtime#16. Not a required check until the
# candidate manifest is re-pinned to published Core and Runtime releases.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-blueprint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild candidate wheels from exact commits and install the Lab wheel
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r dependencies/requirements.lock
          .venv/bin/python -m pip install --require-hashes -r dependencies/rule-admission-build.lock
          .venv/bin/python scripts/build_rule_admission_candidates.py --manifest dependencies/rule-admission-candidate.json
          .venv/bin/python scripts/prepare_dependencies.py --manifest dependencies/rule-admission-candidate.json
          .venv/bin/python scripts/install_dependencies.py --manifest dependencies/rule-admission-candidate.json
          .venv/bin/python -m build --wheel
          .venv/bin/python -m pip install --no-deps dist/*.whl
          .venv/bin/python scripts/audit_install.py --manifest dependencies/rule-admission-candidate.json
          .venv/bin/python -m pip check
      - name: Check the blueprint against the synthetic provider and report coverage
        run: |
          mkdir reports
          .venv/bin/python -I -m pytest -o pythonpath= tests/rule_admission_acceptance -q --junitxml=reports/rule-admission.xml
          .venv/bin/python -I -m lab_runner.rule_admission.blueprint.coverage --json > reports/coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rule-admission-${{ matrix.os }}
          path: reports/
          if-no-files-found: error
