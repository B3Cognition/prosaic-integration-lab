[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic-integration-lab"
version = "0.3.0"
description = "Synthetic acceptance consumer for installed Prosaic releases"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "PyYAML", "jsonschema", "pyuca", "PyJWT[crypto]>=2.15,<3"]

[project.optional-dependencies]
test = ["pytest", "build"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["prosaic_integration_lab*", "lab_runner*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit", "tests/functional"]
