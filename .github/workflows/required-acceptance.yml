name: Required integration acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Qualify exact unpublished SDK artifacts without changing release pins
        type: boolean
        default: false
      context_assembly:
        description: Qualify context SDK candidates and retain the original Runtime PostgreSQL wheel
        type: boolean
        default: false
      core_run_id:
        description: Successful exact-source Core Publish SDK run
        type: string
        default: ''
      core_source:
        description: Exact qualified Core commit
        type: string
        default: ''
      runtime_run_id:
        description: Successful exact-source Runtime Publish SDK run
        type: string
        default: ''
      runtime_source:
        description: Exact qualified Runtime commit
        type: string
        default: ''
      harness_run_id:
        description: Successful exact-source Harness Publish SDK run
        type: string
        default: ''
      harness_source:
        description: Exact qualified Harness commit
        type: string
        default: ''
permissions:
  contents: read
jobs:
  acceptance:
    name: acceptance-${{ matrix.runner }}-pg${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        postgres: [16, 18]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked third-party dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r dependencies/requirements.lock
      - name: Verify and install released Prosaic wheels
        if: ${{ !inputs.candidate }}
        run: |
          .venv/bin/python scripts/prepare_dependencies.py
          .venv/bin/python scripts/install_dependencies.py --manifest dependencies/releases.json
          .venv/bin/python scripts/audit_install.py --manifest dependencies/releases.json
      - name: Verify exact candidate source runs and curate original SDK bytes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_RUN: ${{ inputs.core_run_id }}
          CORE_SOURCE: ${{ inputs.core_source }}
          RUNTIME_RUN: ${{ inputs.runtime_run_id }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          HARNESS_RUN: ${{ inputs.harness_run_id }}
          HARNESS_SOURCE: ${{ inputs.harness_source }}
          CONTEXT_ASSEMBLY: ${{ inputs.context_assembly }}
        run: |
          flags=()
          if [ "$CONTEXT_ASSEMBLY" = "true" ]; then flags+=(--context-assembly); fi
          .venv/bin/python scripts/prepare_sdk_candidates.py --core-run-id "$CORE_RUN" --core-source "$CORE_SOURCE" --runtime-run-id "$RUNTIME_RUN" --runtime-source "$RUNTIME_SOURCE" --harness-run-id "$HARNESS_RUN" --harness-source "$HARNESS_SOURCE" --manifest .cache/sdk-hardening/manifest.json "${flags[@]}"
          .venv/bin/python scripts/install_dependencies.py --manifest .cache/sdk-hardening/manifest.json
          .venv/bin/python scripts/audit_install.py --manifest .cache/sdk-hardening/manifest.json
          .venv/bin/python -m pip check
      - name: Select installed CLI bindings
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify Explorer source and committed offline assets
        run: |
          npm ci --prefix frontend/explorer --ignore-scripts
          npm test --prefix frontend/explorer
          npm run build --prefix frontend/explorer
          git diff --exit-code -- lab_runner/explore/web
          test -z "$(git ls-files --others --exclude-standard -- lab_runner/explore/web)"
      - name: Explorer browser regressions without model calls
        if: ${{ matrix.runner == 'ubuntu-24.04' && matrix.postgres == 16 }}
        run: |
          npm exec --prefix frontend/explorer -- playwright install --with-deps chromium
          npm run test:browser --prefix frontend/explorer
      - name: Install pinned Linux CLI sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap meson ninja-build pkg-config libcap-dev gcc
          git clone https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          git -C "$RUNNER_TEMP/bubblewrap" checkout --detach 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup "$RUNNER_TEMP/bubblewrap/_build" "$RUNNER_TEMP/bubblewrap" --prefix=/usr -Dman=disabled -Dtests=false
          meson compile -C "$RUNNER_TEMP/bubblewrap/_build"
          sudo meson install -C "$RUNNER_TEMP/bubblewrap/_build"
          sudo install -m 0644 .github/ci/bwrap.apparmor /etc/apparmor.d/prosaic-lab-ci-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/prosaic-lab-ci-bwrap
      - name: Require actual CLI confinement without fallback or skipped gates
        run: .venv/bin/python scripts/sandboxed_tools_smoke.py --source-root . --output "$RUNNER_TEMP/sandbox-qualification"
      - name: Select exact conversation SDK capability
        id: conversation-sdk
        env:
          USE_CANDIDATE: ${{ inputs.candidate }}
        run: |
          .venv/bin/python -c "import json,os,sys; sys.path[:0]=['src','.']; from pathlib import Path; from prosaic_integration_lab.dependencies import sdk_manifest; from lab_runner.gates import supports_conversation,supports_context_assembly; from prosaic_integration_lab.conversation_execution import require_conversation_sdk; candidate=os.environ['USE_CANDIDATE']=='true'; manifest=sdk_manifest(Path('.cache/sdk-hardening/manifest.json' if candidate else 'dependencies/releases.json')); enabled=supports_conversation(manifest); assert enabled or not candidate; require_conversation_sdk() if enabled else None; print('enabled='+str(enabled).lower()); print('context='+str(supports_context_assembly(manifest)).lower())" >> "$GITHUB_OUTPUT"
      - name: Verify ordinary public-index consumer adoption
        if: ${{ !inputs.candidate }}
        run: .venv/bin/python scripts/verify_public_adoption.py --manifest dependencies/releases.json --export reports/public-adoption-pg${{ matrix.postgres }}.json
      - name: Verify exact checkout history before full regressions
        run: .venv/bin/python -m pytest -q tests/functional/test_required_acceptance.py -k candidate_checkout_history
      - name: Unit and functional regressions
        if: ${{ steps.conversation-sdk.outputs.context == 'true' }}
        run: .venv/bin/python scripts/regression_profiles.py --profile released --output reports/released-regressions.json
      - name: Released native and unified pool acceptance
        if: ${{ !inputs.candidate }}
        run: .venv/bin/python -m pytest -q tests/native_acceptance
      - name: Current conversation train without context capability
        if: ${{ steps.conversation-sdk.outputs.enabled == 'true' && steps.conversation-sdk.outputs.context != 'true' }}
        run: .venv/bin/python scripts/regression_profiles.py --profile released --output reports/released-regressions.json -- --ignore=tests/functional/test_context_assembly.py --ignore=tests/unit/test_context_counter.py --ignore=tests/unit/test_context_scenarios.py
      - name: Current released baseline units and functional regressions
        if: ${{ steps.conversation-sdk.outputs.enabled != 'true' }}
        run: .venv/bin/python scripts/regression_profiles.py --profile released --output reports/released-regressions.json -- --ignore=tests/functional/test_conversation_journey.py --ignore=tests/functional/test_conversation_http.py --ignore=tests/functional/test_conversation_conformance.py --ignore=tests/functional/test_context_assembly.py --ignore=tests/unit/test_context_counter.py --ignore=tests/unit/test_context_scenarios.py
      - name: Qualify current Lab distributions with public SDKs
        if: ${{ !inputs.candidate && steps.conversation-sdk.outputs.enabled == 'true' }}
        env:
          RUNNER_CELL: ${{ matrix.runner }}
          POSTGRES_CELL: ${{ matrix.postgres }}
        run: |
          .venv/bin/python -m build
          flags=(--manifest dependencies/releases.json)
          if [ "$RUNNER_CELL" = "ubuntu-24.04-arm" ] && [ "$POSTGRES_CELL" = "16" ]; then
            flags+=(--run-stack)
          fi
          .venv/bin/python scripts/conversation_distribution_smoke.py --wheel dist/prosaic_integration_lab-*-py3-none-any.whl --sdist dist/prosaic_integration_lab-*.tar.gz "${flags[@]}" --postgres-version "$POSTGRES_CELL" --export reports/conversation-distribution-pg${{ matrix.postgres }}.json
      - name: Qualify exact candidate Lab wheel and source distribution consumers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
        env:
          RUNNER_CELL: ${{ matrix.runner }}
          POSTGRES_CELL: ${{ matrix.postgres }}
        run: |
          .venv/bin/python -m build
          flags=(--manifest .cache/sdk-hardening/manifest.json --candidate)
          if [ "$RUNNER_CELL" = "ubuntu-24.04-arm" ] && [ "$POSTGRES_CELL" = "16" ]; then
            flags+=(--run-stack)
          fi
          .venv/bin/python scripts/conversation_distribution_smoke.py --wheel dist/prosaic_integration_lab-*-py3-none-any.whl --sdist dist/prosaic_integration_lab-*.tar.gz "${flags[@]}" --postgres-version "$POSTGRES_CELL" --export reports/conversation-distribution-pg${{ matrix.postgres }}.json
      - name: Build immutable consumer
        if: ${{ !inputs.candidate }}
        run: .venv/bin/python scripts/build_consumer.py --manifest dependencies/releases.json --dependency-mode released --tag prosaic-integration-lab:dev
      - name: Build isolated immutable candidate consumer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
        run: .venv/bin/python scripts/build_consumer.py --manifest .cache/sdk-hardening/manifest.json --dependency-mode candidate --tag prosaic-integration-lab:candidate
      - name: Build exact released Lab 0.2.0 baseline
        run: |
          .venv/bin/python scripts/prepare_dependencies.py --manifest dependencies/releases-lab-0.2.0.json
          .venv/bin/python -c "from lab_runner.legacy_upgrade import build_baseline; build_baseline()"
      - name: Required real-stack gates
        if: ${{ !inputs.candidate }}
        run: .venv/bin/python scripts/required_acceptance.py --postgres-version ${{ matrix.postgres }} --export reports/required-pg${{ matrix.postgres }}.json
      - name: Required exact candidate real-stack gates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
        run: .venv/bin/python scripts/required_acceptance.py --candidate --candidate-manifest .cache/sdk-hardening/manifest.json --postgres-version ${{ matrix.postgres }} --export reports/required-pg${{ matrix.postgres }}.json
      - name: Run documented native adoption demo with released SDKs
        if: ${{ !inputs.candidate }}
        run: .venv/bin/python -m lab_runner demo --mode native --postgres-version ${{ matrix.postgres }}
      - name: Run documented native adoption demo with exact candidate SDKs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
        run: .venv/bin/python -m lab_runner demo --mode native --candidate --candidate-manifest .cache/sdk-hardening/manifest.json --postgres-version ${{ matrix.postgres }}
      - name: Run documented conversation demo with released SDKs
        if: ${{ !inputs.candidate && steps.conversation-sdk.outputs.enabled == 'true' }}
        run: .venv/bin/python -m lab_runner demo --mode conversation --postgres-version ${{ matrix.postgres }}
      - name: Run documented conversation demo with exact candidate SDKs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
        run: .venv/bin/python -m lab_runner demo --mode conversation --candidate --candidate-manifest .cache/sdk-hardening/manifest.json --postgres-version ${{ matrix.postgres }}
      - name: Run optional context comparison with exact candidate SDKs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate && inputs.context_assembly }}
        run: .venv/bin/python -m lab_runner demo --mode conversation --context-assembly --candidate --candidate-manifest .cache/sdk-hardening/manifest.json --postgres-version ${{ matrix.postgres }}
      - name: Retain qualified Lab build bytes
        if: ${{ success() && !inputs.candidate && matrix.runner == 'ubuntu-24.04-arm' && matrix.postgres == 16 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-release-bytes
          path: |
            dist/prosaic_integration_lab-*-py3-none-any.whl
            dist/prosaic_integration_lab-*.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Upload safe gate summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.runner }}-pg${{ matrix.postgres }}
          path: |
            reports/required-pg${{ matrix.postgres }}.json
            reports/public-adoption-pg${{ matrix.postgres }}.json
            reports/conversation-distribution-pg${{ matrix.postgres }}.json
          if-no-files-found: error
          retention-days: 14
