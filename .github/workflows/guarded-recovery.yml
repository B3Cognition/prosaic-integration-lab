name: Guarded recovery blueprint
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    name: Guarded recovery installed (${{ matrix.origin }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        origin: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check the copied host with the exact released SDK profile
        env:
          BUILD_ORIGIN: ${{ matrix.origin }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r dependencies/requirements.lock -r dependencies/rule-admission-build.lock
          .venv/bin/python scripts/qualify_guarded_recovery.py --origin "$BUILD_ORIGIN" --export "$RUNNER_TEMP/guarded-recovery.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guarded-recovery-${{ matrix.origin }}
          path: ${{ runner.temp }}/guarded-recovery.json
          if-no-files-found: error
