name: Rule admission integration
# Released guarded-conversation lane. All four cells are required for Lab release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-blueprint:
    name: rule-admission-${{ matrix.os }}-pg${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        postgres: ['16', '18']
        include:
          - postgres: '16'
            postgres_image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          - postgres: '18'
            postgres_image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install checksum-pinned released SDKs and the Lab wheel
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r dependencies/requirements.lock
          .venv/bin/python -m pip install --require-hashes -r dependencies/rule-admission-build.lock
          .venv/bin/python scripts/prepare_dependencies.py --manifest dependencies/releases.json
          .venv/bin/python scripts/install_dependencies.py --manifest dependencies/releases.json
          .venv/bin/python -m build --wheel
          .venv/bin/python -m pip install --no-deps dist/*.whl
          .venv/bin/python scripts/audit_install.py --manifest dependencies/releases.json
          .venv/bin/python -m pip install --no-deps --require-hashes -r dependencies/mcp-client.lock
          .venv/bin/python -m pip check
      - name: Check the blueprint against the synthetic provider and report coverage
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: synthetic-only
        run: |
          mkdir reports
          PROSAIC_RULE_POSTGRES_DSN="$(.venv/bin/python -c 'import os; from psycopg.conninfo import make_conninfo; print(make_conninfo(host=os.environ["PGHOST"], port=os.environ["PGPORT"], user=os.environ["PGUSER"], dbname=os.environ["PGDATABASE"], password=os.environ["PGPASSWORD"]))')"
          export PROSAIC_RULE_POSTGRES_DSN
          .venv/bin/python -I -m pytest -o pythonpath= tests/rule_admission_acceptance -q --junitxml=reports/rule-admission.xml
          if .venv/bin/python -I -c "import sys; from pathlib import Path; from lab_runner.gates import supports_sub_agents; from prosaic_integration_lab.dependencies import sdk_manifest; sys.exit(0 if supports_sub_agents(sdk_manifest(Path('dependencies/releases.json'))) else 3)"; then
            export PROSAIC_SUB_AGENTS_REQUIRED=1
          elif [ "$?" -ne 3 ]; then
            exit 1
          fi
          PROSAIC_BLUEPRINT_INSTALLED=1 PROSAIC_MCP_CLIENT_REQUIRED=1 .venv/bin/python -I -m pytest -o pythonpath= tests/blueprint_acceptance -q --junitxml=reports/feature-blueprints.xml
          .venv/bin/python -I -m pytest -o pythonpath= tests/rule_admission_postgres -q --junitxml=reports/rule-postgres.xml
          .venv/bin/python -I -m lab_runner.rule_admission.blueprint.coverage --json > reports/coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rule-admission-${{ matrix.os }}-pg${{ matrix.postgres }}
          path: reports/
          if-no-files-found: error
