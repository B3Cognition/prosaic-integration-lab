name: Experimental catalogue ontology

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/catalogue-ontology.yml'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'dependencies/*.lock'
      - 'docs/catalogue-ontology.md'
      - 'scripts/qualify_catalogue_ontology.py'
      - 'lab_runner/blueprints/catalogue_ontology/**'
      - 'tests/catalogue_ontology_acceptance/**'
  workflow_dispatch:
    inputs:
      candidate:
        description: Run the full build-only ontology candidate qualification
        type: boolean
        default: false
      core_run_id:
        description: Successful exact-source Core build-only run
        type: string
      core_source:
        description: Exact Core source commit
        type: string
      harness_run_id:
        description: Successful exact-source Harness build-only run
        type: string
      harness_source:
        description: Exact Harness source commit
        type: string

permissions:
  contents: read

jobs:
  installed-ontology:
    if: ${{ !inputs.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        origin: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Qualify the copied blueprint in an isolated RC consumer
        env:
          BUILD_ORIGIN: ${{ matrix.origin }}
        run: |
          python -m venv "$RUNNER_TEMP/ontology-builder"
          builder="$RUNNER_TEMP/ontology-builder/bin/python"
          "$builder" -m pip install --require-hashes -r dependencies/requirements.lock -r dependencies/rule-admission-build.lock
          "$builder" scripts/qualify_catalogue_ontology.py --origin "$BUILD_ORIGIN" \
            --export "$RUNNER_TEMP/catalogue-ontology-summary.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalogue-ontology-${{ matrix.origin }}
          path: ${{ runner.temp }}/catalogue-ontology-summary.json
          if-no-files-found: error

  candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/catalogue-ontology-candidate.yml
    with:
      core_run_id: ${{ inputs.core_run_id }}
      core_source: ${{ inputs.core_source }}
      harness_run_id: ${{ inputs.harness_run_id }}
      harness_source: ${{ inputs.harness_source }}
    secrets:
      ECOSYSTEM_ARTIFACT_TOKEN: ${{ secrets.ECOSYSTEM_ARTIFACT_TOKEN }}
